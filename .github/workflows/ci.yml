name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run test suite
        run: python -m pytest --tb=short

      - name: API smoke test
        run: |
          CREDIT_API_KEY=ci-smoke-test-key python -m uvicorn api:app --host 127.0.0.1 --port 8123 &
          sleep 4
          curl -sf http://127.0.0.1:8123/health | grep '"status":"ok"'
          curl -sf -o /dev/null -w '%{http_code}' http://127.0.0.1:8123/model/info | grep 422
