# TEMPLATE ONLY -- do not commit a real key here, and do not `kubectl apply`
# this file as-is in anything but a local throwaway cluster. The placeholder
# below is deliberately the same insecure fallback api.py itself warns about
# on startup, so it's obvious if it ever ends up running for real.
#
# For anything beyond local testing, create the secret imperatively instead
# (it never touches a file, never gets committed, never shows up in `git diff`):
#
#   kubectl create secret generic credit-risk-secrets \
#     --namespace credit-risk \
#     --from-literal=CREDIT_API_KEY='<a real, randomly generated key>'
#
apiVersion: v1
kind: Secret
metadata:
  name: credit-risk-secrets
  namespace: credit-risk
type: Opaque
stringData:
  CREDIT_API_KEY: "dev-only-insecure-key-change-me"
